<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritmo — hábitos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c45c26'/%3E%3Cpath d='M8 16.5 13.2 22 24 10' fill='none' stroke='%23fff7f2' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee6;--surface:#fffdf8;--ink:#1c1915;--muted:#6e675e;--line:#e4dcd0;--accent:#c45c26;--accent-ink:#fff7f2;--today:#f6e7d4;--shadow:0 18px 40px rgba(48,32,16,.06);--radius:18px;--sans:"Outfit",system-ui,sans-serif;--serif:"Fraunces",Georgia,serif}
*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:radial-gradient(1100px 480px at 8% -12%,#efe4d2 0%,transparent 55%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:28px 0 64px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:20px}
.mark{font-family:var(--serif);font-weight:650;font-size:42px;letter-spacing:-.035em;line-height:.95}
.sub{color:var(--muted);margin-top:6px}
.pill{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;box-shadow:var(--shadow)}
.pill strong{display:block;font-size:14px}.pill span{color:var(--muted);font-size:12px}.ring{width:38px;height:38px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:flex;background:#ebe4d8;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:40px;padding:0 14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.nav{display:flex;align-items:center;gap:8px}
.nav button,.ghost,.primary,.iconish{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px}
.nav button{width:44px}.label{min-width:150px;text-align:center;font-weight:600;font-size:14px}
.ghost{padding:0 14px;background:transparent}.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;padding:0 16px;font-weight:600}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.week-head,.habit{display:grid;grid-template-columns:minmax(190px,1.25fr) minmax(320px,2fr) 132px;gap:10px;align-items:center;padding:10px 14px}
.week-head{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.habit{border-top:1px solid var(--line)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center}
.dh.today{color:var(--accent);font-weight:600}
.meta{display:flex;gap:10px;min-width:0;align-items:center}
.swatch{width:10px;height:38px;border-radius:99px;flex:none}
.meta h3{margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:2px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{height:52px;border-radius:12px;border:1px solid var(--line);background:#faf7f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.check.today{background:var(--today);border-color:#edd3b0}
.check.on{color:#fff;border-color:transparent}
.check .wd{font-size:10px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.check svg{width:16px;height:16px}
.stats{text-align:right;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:18px;letter-spacing:-.03em}
.row-actions{display:flex;justify-content:flex-end;gap:8px}
.row-actions button{border:0;background:transparent;color:var(--muted);min-height:32px;padding:0}
.row-actions button:hover{color:var(--ink)}
.empty{padding:42px 18px 32px;text-align:center}
.empty h2{font-family:var(--serif);font-weight:560;font-size:30px;margin:0 0 8px}
.empty p{color:var(--muted);max-width:440px;margin:0 auto 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1px dashed #cfc4b4;background:transparent;border-radius:999px;min-height:40px;padding:0 12px}
.month{padding:12px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:12px}
.filters button{border:1px solid var(--line);background:#faf7f2;border-radius:999px;min-height:36px;padding:0 12px;white-space:nowrap;font-size:13px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.day{min-height:74px;border-radius:14px;border:1px solid transparent;background:#faf7f2;padding:6px 6px 8px;text-align:left}
.day.out{opacity:.35}.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .n{font-size:12px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}.dot{width:8px;height:8px;border-radius:99px}
.cell{min-height:46px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.pillbit{height:26px;width:100%}
.solo{border-radius:999px}.start{border-radius:999px 0 0 999px}.mid{border-radius:0}.end{border-radius:0 999px 999px 0}
.miss{width:7px;height:7px;border-radius:99px;background:#e4dcd0}
.note{color:var(--muted);font-size:13px;margin:10px 2px 0}
.panel{margin-top:14px;display:grid;grid-template-columns:1fr 1.15fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-family:var(--serif);font-weight:560;font-size:22px;margin:0 0 12px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#faf7f2;border-radius:14px;padding:10px 12px}
.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:22px;letter-spacing:-.03em}
.hstat{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bar{height:6px;background:#efe7dc;border-radius:99px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%}
.foot{margin-top:16px;color:var(--muted);font-size:12px}
dialog{border:0;padding:0;background:transparent;width:min(440px,calc(100% - 24px))}dialog::backdrop{background:rgba(28,25,21,.4)}
.sheet{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line)}
.sheet h2{font-family:var(--serif);font-weight:560;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:#faf7f2;border-radius:12px;padding:12px;min-height:44px}textarea{min-height:72px;resize:vertical}
.colors{display:flex;gap:8px;flex-wrap:wrap}.colors button{width:36px;height:36px;border-radius:99px;border:2px solid transparent}.colors button[aria-pressed=true]{border-color:var(--ink)}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-top:16px}.danger{border:0;background:transparent;color:#8c3a3a;min-height:44px}
.list{display:flex;flex-direction:column;gap:8px}.list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#faf7f2;border-radius:12px;min-height:48px;padding:8px 12px}
@media(max-width:860px){.top{flex-direction:column;align-items:flex-start}.mark{font-size:36px}.week-head{display:none}.habit,.panel{grid-template-columns:1fr}.stats{text-align:left;display:flex;gap:12px;align-items:baseline}.stats b{display:inline;font-size:15px}.row-actions{justify-content:flex-start}.day{min-height:58px}.stat-grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="mark">Ritmo</div><div class="sub" id="dateLine"></div></div>
    <div class="pill" id="todayPill"></div>
  </header>
  <div class="toolbar">
    <div class="seg">
      <button type="button" id="tabWeek" aria-pressed="true">Semana</button>
      <button type="button" id="tabMonth" aria-pressed="false">Mês</button>
    </div>
    <div class="nav">
      <button type="button" id="prev" aria-label="Período anterior">‹</button>
      <div class="label" id="periodLabel"></div>
      <button type="button" id="next" aria-label="Próximo período">›</button>
      <button type="button" class="ghost" id="jumpToday">Hoje</button>
    </div>
    <button type="button" class="primary" id="addBtn">Novo hábito</button>
  </div>
  <section class="board" id="board"></section>
  <section class="panel" id="panel"></section>
  <p class="foot">Os hábitos ficam só neste navegador. Nada é enviado a um servidor.</p>
</div>
<dialog id="editor"><form class="sheet" id="editorForm">
  <h2 id="editorTitle">Novo hábito</h2>
  <label for="name">Nome</label>
  <input id="name" type="text" maxlength="48" required placeholder="Ex.: Caminhar 20 minutos">
  <label for="note">Intenção (opcional)</label>
  <textarea id="note" maxlength="80" placeholder="Por que isso importa"></textarea>
  <label>Cor</label><div class="colors" id="colors"></div>
  <div class="sheet-actions">
    <button type="button" class="danger" id="deleteBtn" hidden>Excluir</button>
    <span style="flex:1"></span>
    <button type="button" class="ghost" id="cancelBtn">Cancelar</button>
    <button type="submit" class="primary">Salvar</button>
  </div>
</form></dialog>
<dialog id="dayDialog"><div class="sheet">
  <h2 id="dayTitle"></h2>
  <div class="list" id="dayList"></div>
  <div class="sheet-actions"><span style="flex:1"></span><button type="button" class="primary" id="dayClose">Fechar</button></div>
</div></dialog>
<script>
const KEY="ritmo.v1";
const COLORS=[{id:"moss",hex:"#3f6b4a"},{id:"clay",hex:"#c45c26"},{id:"sea",hex:"#2f6f7e"},{id:"navy",hex:"#2c3e6b"},{id:"plum",hex:"#6b3a5a"},{id:"gold",hex:"#a0792c"},{id:"berry",hex:"#8c3a3a"},{id:"slate",hex:"#4a5560"}];
const SUGGESTIONS=[{name:"Beber água",note:"Um copo ao acordar",color:"sea"},{name:"Ler 20 minutos",note:"Páginas, não telas",color:"navy"},{name:"Caminhar",note:"Sair de casa, mesmo pouco",color:"moss"},{name:"Meditar",note:"Dez minutos em silêncio",color:"plum"},{name:"Dormir no horário",note:"A mesma hora, quase todo dia",color:"gold"}];
const WD=["seg","ter","qua","qui","sex","sáb","dom"];
const MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const $=s=>document.querySelector(s);
let state=load(), view="week", anchor=startOfDay(new Date()), focusHabit="all", editingId=null, picked="clay";
function load(){try{const raw=localStorage.getItem(KEY); if(!raw) return {habits:[],checks:{}}; const d=JSON.parse(raw); if(!d||!Array.isArray(d.habits)||typeof d.checks!=="object") return {habits:[],checks:{}}; return d;}catch(e){return {habits:[],checks:{}};}}
function save(){localStorage.setItem(KEY, JSON.stringify(state));}
function uid(){return Math.random().toString(36).slice(2,10);}
function startOfDay(d){const x=new Date(d); x.setHours(0,0,0,0); return x;}
function iso(d){const x=startOfDay(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function parseISO(s){const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return startOfDay(x);}
function mondayOf(d){const x=startOfDay(d); return addDays(x,-((x.getDay()+6)%7));}
function colorOf(id){return COLORS.find(c=>c.id===id)||COLORS[0];}
function checked(id,day){return !!(state.checks[id]&&state.checks[id][day]);}
function setChecked(id,day,on){if(!state.checks[id]) state.checks[id]={}; if(on) state.checks[id][day]=true; else delete state.checks[id][day]; save();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function tick(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>';}
function currentStreak(h,todayIso){let cursor=todayIso; if(!checked(h.id,cursor)){const y=iso(addDays(parseISO(cursor),-1)); if(!checked(h.id,y)) return 0; cursor=y;} let n=0; while(checked(h.id,cursor)){n++; cursor=iso(addDays(parseISO(cursor),-1)); if(n>4000) break;} return n;}
function bestStreak(h){const days=Object.keys(state.checks[h.id]||{}).sort(); if(!days.length) return 0; let best=1,run=1; for(let i=1;i<days.length;i++){const diff=Math.round((parseISO(days[i])-parseISO(days[i-1]))/86400000); if(diff===1){run++; best=Math.max(best,run);} else if(diff>1) run=1;} return best;}
function rate(h,back,end){let done=0,total=0; for(let i=0;i<back;i++){const day=iso(addDays(end,-i)); total++; if(checked(h.id,day)) done++;} return {done,total,pct: total?Math.round(done/total*100):0};}
function fmtShort(s){const d=parseISO(s); return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);}
function formatRange(a,b){if(a.getMonth()===b.getMonth()) return a.getDate()+"–"+b.getDate()+" "+MONTHS[a.getMonth()]; return a.getDate()+" "+MONTHS[a.getMonth()].slice(0,3)+" – "+b.getDate()+" "+MONTHS[b.getMonth()].slice(0,3);}
function render(){
  const today=startOfDay(new Date()), todayIso=iso(today);
  const long=today.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  $("#dateLine").textContent=long.charAt(0).toUpperCase()+long.slice(1);
  const habits=state.habits, doneToday=habits.filter(h=>checked(h.id,todayIso)).length;
  const pct=habits.length?doneToday/habits.length:0;
  const msg=!habits.length?"Sem hábitos ainda":doneToday===habits.length?"Dia completo":doneToday===0?"O dia ainda está aberto":doneToday+" de "+habits.length;
  const detail=!habits.length?"escolha um começo":doneToday===habits.length?"isso vira identidade":doneToday===0?"marque o que já fez":"falta pouco";
  const r=15,c=2*Math.PI*r,dash=(pct*c).toFixed(1);
  $("#todayPill").innerHTML='<svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="'+r+'" fill="none" stroke="#e4dcd0" stroke-width="3"/><circle cx="18" cy="18" r="'+r+'" fill="none" stroke="#c45c26" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+dash+' '+c+'" transform="rotate(-90 18 18)"/></svg><div><strong>'+escapeHtml(msg)+'</strong><span>'+escapeHtml(detail)+'</span></div>';
  $("#tabWeek").setAttribute("aria-pressed", String(view==="week"));
  $("#tabMonth").setAttribute("aria-pressed", String(view==="month"));
  if(view==="week"){const start=mondayOf(anchor); $("#periodLabel").textContent=formatRange(start, addDays(start,6)); renderWeek(start, todayIso);} 
  else {$("#periodLabel").textContent=MONTHS[anchor.getMonth()]+" "+anchor.getFullYear(); renderMonth(todayIso);}
  renderPanel(todayIso);
}
function renderWeek(start, todayIso){
  const days=Array.from({length:7},(_,i)=>addDays(start,i));
  if(!state.habits.length){$("#board").innerHTML=emptyHTML(); return;}
  const head='<div class="week-head"><div></div><div class="days7">'+days.map(d=>{const t=iso(d)===todayIso?" today":""; return '<div class="dh'+t+'">'+WD[(d.getDay()+6)%7]+'<br>'+d.getDate()+'</div>';}).join("")+'</div><div></div></div>';
  const rows=state.habits.map(h=>{
    const streak=currentStreak(h,todayIso), r30=rate(h,30,parseISO(todayIso)), hex=colorOf(h.color).hex;
    const cells=days.map(d=>{const id=iso(d), on=checked(h.id,id), future=id>todayIso; const cls="check"+(id===todayIso?" today":"")+(on?" on":""); const style=on?' style="background:'+hex+'"':""; return '<button type="button" class="'+cls+'" data-habit="'+h.id+'" data-day="'+id+'" aria-pressed="'+on+'" aria-label="'+escapeHtml(h.name)+' '+id+'"'+(future?" disabled":"")+style+'>'+(on?tick():'<span class="wd">'+WD[(d.getDay()+6)%7]+'</span><span class="wd">'+d.getDate()+'</span>')+'</button>';}).join("");
    return '<article class="habit"><div class="meta"><div class="swatch" style="background:'+hex+'"></div><div style="min-width:0"><h3>'+escapeHtml(h.name)+'</h3><p>'+escapeHtml(h.note||("desde "+fmtShort(h.createdAt)))+'</p></div></div><div class="days7">'+cells+'</div><div><div class="stats"><b>'+streak+'d</b>sequência · '+r30.pct+'% em 30d</div><div class="row-actions"><button type="button" data-edit="'+h.id+'">Editar</button><button type="button" data-del="'+h.id+'">Excluir</button></div></div></article>';
  }).join("");
  $("#board").innerHTML=head+rows;
}
function emptyHTML(){return '<div class="empty"><h2>Nenhum hábito ainda</h2><p>Um quadro pequeno e honesto. Comece por um gesto que cabe no dia, e marque só o que aconteceu.</p><div class="chips">'+SUGGESTIONS.map((s,i)=>'<button type="button" data-suggest="'+i+'">'+escapeHtml(s.name)+'</button>').join("")+'</div></div>';}
function renderMonth(todayIso){
  if(!state.habits.length){$("#board").innerHTML=emptyHTML(); return;}
  const year=anchor.getFullYear(), month=anchor.getMonth();
  const first=new Date(year,month,1), start=mondayOf(first);
  const cells=[]; for(let i=0;i<42;i++) cells.push(addDays(start,i));
  if(cells[35].getMonth()!==month) cells.splice(35,7);
  const filters='<div class="filters"><button type="button" data-focus="all" aria-pressed="'+(focusHabit==="all")+'">Todos</button>'+state.habits.map(h=>'<button type="button" data-focus="'+h.id+'" aria-pressed="'+(focusHabit===h.id)+'">'+escapeHtml(h.name)+'</button>').join("")+'</div>';
  const dows=WD.map(w=>'<div class="dow">'+w+'</div>').join("");
  let body;
  if(focusHabit==="all"){
    body=cells.map(d=>{const id=iso(d), out=d.getMonth()!==month, dots=state.habits.filter(h=>checked(h.id,id)).map(h=>'<i class="dot" style="background:'+colorOf(h.color).hex+'"></i>').join(""); return '<button type="button" class="day'+(out?" out":"")+(id===todayIso?" today":"")+'" data-dayopen="'+id+'"><div class="n">'+d.getDate()+'</div><div class="dots">'+dots+'</div></button>';}).join("");
  } else {
    const h=state.habits.find(x=>x.id===focusHabit)||state.habits[0];
    const hex=colorOf(h.color).hex;
    body=cells.map(d=>{const id=iso(d), out=d.getMonth()!==month, on=checked(h.id,id)&&!out; const idx=(d.getDay()+6)%7; const left=idx>0&&checked(h.id,iso(addDays(d,-1))); const right=idx<6&&checked(h.id,iso(addDays(d,1))); let shape="solo"; if(on&&left&&right) shape="mid"; else if(on&&right) shape="start"; else if(on&&left) shape="end"; let inner=""; if(on) inner='<div class="pillbit '+shape+'" style="background:'+hex+'"></div>'; else if(!out && id<=todayIso && id>=h.createdAt) inner='<i class="miss"></i>'; return '<button type="button" class="day cell'+(out?" out":"")+(id===todayIso?" today":"")+'" data-dayopen="'+id+'">'+inner+'<span class="n" style="position:absolute;left:8px;top:4px">'+d.getDate()+'</span></button>';}).join("");
  }
  const h=state.habits.find(x=>x.id===focusHabit);
  const extra=h?('<p class="note">Sequência atual '+currentStreak(h,todayIso)+' · recorde '+bestStreak(h)+' · '+rate(h,30,parseISO(todayIso)).pct+'% nos últimos 30 dias. Toque um dia para marcar.</p>'):'<p class="note">Cada ponto é um hábito feito. Toque o dia para marcar ou desmarcar.</p>';
  $("#board").innerHTML='<div class="month">'+filters+'<div class="cal">'+dows+body+'</div>'+extra+'</div>';
}
function perfectStreak(todayIso){if(!state.habits.length) return 0; const all=day=>state.habits.every(h=>checked(h.id,day)); let cursor=todayIso; if(!all(cursor)){const y=iso(addDays(parseISO(cursor),-1)); if(!all(y)) return 0; cursor=y;} let n=0; while(all(cursor)){n++; cursor=iso(addDays(parseISO(cursor),-1)); if(n>4000) break;} return n;}
function renderPanel(todayIso){
  if(!state.habits.length){$("#panel").innerHTML=""; return;}
  const weekStart=mondayOf(parseISO(todayIso)); let weekDone=0,weekTotal=0;
  state.habits.forEach(h=>{for(let i=0;i<7;i++){const d=iso(addDays(weekStart,i)); if(d>todayIso) continue; weekTotal++; if(checked(h.id,d)) weekDone++;}});
  const weekPct=weekTotal?Math.round(weekDone/weekTotal*100):0;
  const lines=state.habits.map(h=>{const r=rate(h,30,parseISO(todayIso)); const hex=colorOf(h.color).hex; return '<div class="hstat"><i class="swatch" style="height:28px;background:'+hex+'"></i><div><strong>'+escapeHtml(h.name)+'</strong><div class="bar"><i style="width:'+r.pct+'%;background:'+hex+'"></i></div></div><div class="stats"><b>'+currentStreak(h,todayIso)+'d</b>recorde '+bestStreak(h)+'d</div></div>';}).join("");
  $("#panel").innerHTML='<article class="card"><h2>Esta semana</h2><div class="stat-grid"><div class="stat"><span>Conclusão</span><strong>'+weekPct+'%</strong></div><div class="stat"><span>Marcações</span><strong>'+weekDone+'</strong></div><div class="stat"><span>Dias perfeitos</span><strong>'+perfectStreak(todayIso)+'</strong></div></div><p class="note" style="margin-top:8px">Dia perfeito é quando todos os hábitos ativos foram marcados. A sequência de hoje só quebra amanhã, se o dia passar em branco.</p></article><article class="card"><h2>Por hábito</h2>'+lines+'</article>';
}
function openEditor(id){
  editingId=id||null; const h=state.habits.find(x=>x.id===id);
  $("#editorTitle").textContent=h?"Editar hábito":"Novo hábito";
  $("#name").value=h?h.name:""; $("#note").value=h?(h.note||""):"";
  picked=h?h.color:COLORS[state.habits.length%COLORS.length].id;
  $("#deleteBtn").hidden=!h; paintColors(); $("#editor").showModal(); $("#name").focus();
}
function paintColors(){$("#colors").innerHTML=COLORS.map(c=>'<button type="button" data-color="'+c.id+'" aria-label="'+c.id+'" aria-pressed="'+(picked===c.id)+'" style="background:'+c.hex+'"></button>').join("");}
function removeHabit(id){const h=state.habits.find(x=>x.id===id); if(!h) return; if(!confirm("Excluir “"+h.name+"” e o histórico dele?")) return; state.habits=state.habits.filter(x=>x.id!==id); delete state.checks[id]; if(focusHabit===id) focusHabit="all"; save(); render();}
function openDay(day){
  const d=parseISO(day); const title=d.toLocaleDateString("pt-BR",{weekday:"long", day:"numeric", month:"long"});
  $("#dayTitle").textContent=title.charAt(0).toUpperCase()+title.slice(1);
  const future=day>iso(startOfDay(new Date()));
  $("#dayList").innerHTML=state.habits.map(h=>{const on=checked(h.id,day); return '<button type="button" data-dayhabit="'+h.id+'" data-day="'+day+'" '+(future?"disabled":"")+'><i class="dot" style="background:'+colorOf(h.color).hex+';width:12px;height:12px"></i><span style="flex:1">'+escapeHtml(h.name)+'</span><strong>'+(on?"feito":"marcar")+'</strong></button>';}).join("") || "<p>Nenhum hábito.</p>";
  $("#dayDialog").showModal();
}
function addSuggestion(i){const s=SUGGESTIONS[i]; if(!s) return; const habit={id:uid(), name:s.name, note:s.note, color:s.color, createdAt:iso(new Date())}; state.habits.push(habit); state.checks[habit.id]={}; save(); render();}
$("#tabWeek").onclick=()=>{view="week"; anchor=startOfDay(new Date()); render();};
$("#tabMonth").onclick=()=>{view="month"; anchor=startOfDay(new Date()); render();};
$("#prev").onclick=()=>{anchor=view==="week"?addDays(anchor,-7):new Date(anchor.getFullYear(), anchor.getMonth()-1, 1); render();};
$("#next").onclick=()=>{anchor=view==="week"?addDays(anchor,7):new Date(anchor.getFullYear(), anchor.getMonth()+1, 1); render();};
$("#jumpToday").onclick=()=>{anchor=startOfDay(new Date()); render();};
$("#addBtn").onclick=()=>openEditor(null);
$("#cancelBtn").onclick=()=>$("#editor").close();
$("#dayClose").onclick=()=>$("#dayDialog").close();
$("#deleteBtn").onclick=()=>{if(editingId){const id=editingId; $("#editor").close(); removeHabit(id);}};
$("#colors").onclick=e=>{const b=e.target.closest("[data-color]"); if(!b) return; picked=b.dataset.color; paintColors();};
$("#editorForm").onsubmit=e=>{e.preventDefault(); const name=$("#name").value.trim(); if(!name) return; if(editingId){const h=state.habits.find(x=>x.id===editingId); if(h){h.name=name; h.note=$("#note").value.trim(); h.color=picked;}} else {const habit={id:uid(),name,note:$("#note").value.trim(),color:picked,createdAt:iso(new Date())}; state.habits.push(habit); state.checks[habit.id]={};} save(); $("#editor").close(); render();};
$("#board").onclick=e=>{const b=e.target.closest("button"); if(!b) return; if(b.dataset.suggest!=null){addSuggestion(Number(b.dataset.suggest)); return;} if(b.dataset.edit){openEditor(b.dataset.edit); return;} if(b.dataset.del){removeHabit(b.dataset.del); return;} if(b.dataset.focus){focusHabit=b.dataset.focus; render(); return;} if(b.dataset.dayopen){openDay(b.dataset.dayopen); return;} if(b.dataset.habit&&b.dataset.day&&!b.disabled){setChecked(b.dataset.habit,b.dataset.day,b.getAttribute("aria-pressed")!=="true"); render();}};
$("#dayList").onclick=e=>{const b=e.target.closest("[data-dayhabit]"); if(!b||b.disabled) return; setChecked(b.dataset.dayhabit,b.dataset.day,!checked(b.dataset.dayhabit,b.dataset.day)); openDay(b.dataset.day); render();};
render();
</script>
</body>
</html>
